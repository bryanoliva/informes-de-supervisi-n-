<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e4d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Actas GR">

<title>Actas de Obra · Grupo Roble</title>
<style>
:root{--g:#1e4d3a;--g2:#2d6a4f;--g3:#e8f1ec;--ac:#b8893b;--bg:#f4f5f3;--tx:#1d2420;--mu:#68726c;--bd:#d5dbd7;--rd:#b3261e;--cd:#fff;--ri:#fafbfa}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header.top{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header.top h1{font-size:17px;margin:0;flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .st{font-size:12px;opacity:.8}
main{max-width:900px;margin:0 auto;padding:14px 14px 90px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--g);background:var(--g);color:#fff;border-radius:8px;padding:10px 14px;font-weight:600}
.btn.sec{background:var(--cd);color:var(--g)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.5);color:#fff;padding:7px 11px}
.btn.danger{background:var(--cd);color:var(--rd);border-color:var(--rd)}
.btn.sm{padding:6px 10px;font-size:13px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px;color:var(--g);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.card h2 .n{background:var(--g);color:#fff;border-radius:6px;padding:1px 8px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mu);font-weight:600}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g2);border-color:var(--g2)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;flex-shrink:0}
.seg button{border:0;background:var(--cd);padding:9px 12px;color:var(--tx);border-right:1px solid var(--bd);min-width:44px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--g);color:#fff;font-weight:600}
.seg.wrap{flex-wrap:wrap}
.crow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-top:1px solid #edf0ee;align-items:center}
.crow:first-of-type{border-top:0}
.crow .cl{grid-column:1/-1;font-weight:500}
.crow input{grid-column:1/-1}
@media(min-width:720px){.crow{grid-template-columns:1.4fr auto 1fr}.crow .cl{grid-column:auto}.crow input{grid-column:auto}}
.lab{font-size:12px;color:var(--mu);font-weight:600;margin:10px 0 4px;display:block}
.row-item{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px;background:var(--ri)}
.row-item .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;color:var(--g)}
.x{border:0;background:transparent;color:var(--rd);font-size:20px;line-height:1;padding:2px 8px}
.chk{display:flex;align-items:center;gap:10px;padding:8px 0}
.chk input{width:22px;height:22px;flex-shrink:0}
.note{font-size:12.5px;color:var(--mu);font-style:italic;margin-top:8px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:10px}
.ph{border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:var(--cd)}
.ph img{width:100%;height:120px;object-fit:cover;display:block}
.ph .b{padding:6px;display:flex;gap:4px}
.ph input{font-size:14px;padding:6px}
.sig{border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:10px}
.sig h3{margin:0 0 8px;font-size:13px;color:var(--g)}
.sig .sp{height:70px;border:1px dashed var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;margin:8px 0;background:#fff;color:var(--mu);font-size:13px}
.sig .sp img{max-height:66px;max-width:100%}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between}
.item .t{font-weight:600}
.item .s{font-size:12.5px;color:var(--mu)}
.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:5px;padding:2px 7px;background:var(--g3);color:var(--g);margin-right:6px}
.badge.r{background:#f6ead3;color:#7a5614}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.newbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.newbtns .btn{padding:18px 10px;font-size:16px}
.warn{background:var(--cd)6e0;border:1px solid #e6cf94;border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--cd);border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:15}
.bar .btn{flex:1;max-width:320px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--cd);border-radius:14px;padding:16px;max-width:640px;width:100%}
.modal canvas{width:100%;height:220px;border:1px solid var(--bd);border-radius:8px;touch-action:none;background:#fff;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#1d2420;color:#fff;padding:10px 16px;border-radius:10px;z-index:60;max-width:90%;font-size:14px}
body.dark{--bg:#121614;--tx:#e6ebe8;--mu:#9aa6a0;--bd:#33403a;--cd:#1c221f;--ri:#171c1a;--g3:#23342b}
body.dark .btn.sec,body.dark .card h2,body.dark .sig h3{color:#8fd1b0}
body.dark .btn.sec{border-color:#4a8a6e}
body.dark .warn{background:#3b3320;border-color:#6b5a2a;color:#f0e2b6}
a.btn{text-decoration:none;display:inline-block}
fieldset.lock{border:0;padding:0;margin:0;min-width:0;opacity:.9}
fieldset.lock input,fieldset.lock textarea,fieldset.lock select{background:var(--ri)}
.wm{position:relative}.wm textarea{padding-right:44px}
.mic{position:absolute;right:6px;top:6px;border:1px solid var(--bd);background:var(--cd);border-radius:8px;padding:4px 7px;font-size:16px}
.mic.on{background:var(--rd);color:#fff}
.pbar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:8px}.pbar i{display:block;height:100%;background:var(--g2)}
.venc{color:var(--rd);font-weight:700}
.srch{margin-bottom:10px}
.empty{text-align:center;color:var(--mu);padding:24px}
/* ---------- Documento (vista previa / PDF) ---------- */
.sheet{background:#fff;color:#000;font:10pt/1.35 Arial,Helvetica,sans-serif;padding:14mm;max-width:216mm;margin:0 auto;border:1px solid var(--bd)}
.sheet h1{font-size:15pt;text-align:center;margin:0 0 4px;color:var(--g)}
.sheet .sub{text-align:center;font-size:9pt;color:#555;margin-bottom:10px}
.sheet h2{font-size:10.5pt;background:var(--g);color:#fff;padding:4px 8px;margin:14px 0 6px;break-after:avoid}
.sheet table{width:100%;border-collapse:collapse;margin-bottom:6px}
.sheet td,.sheet th{border:1px solid #999;padding:4px 6px;vertical-align:top;font-size:9.5pt}
.sheet th{background:#e8f1ec;text-align:left}
.sheet td.l{background:#f1f4f2;font-weight:700;width:17%}
.sheet tr{break-inside:avoid}
.sheet p{margin:6px 0;text-align:justify}
.sheet .it{font-style:italic;font-size:9pt;color:#444}
.sheet .sg{display:grid;gap:10px;margin-top:8px}
.sheet .sgb{border:1px solid #999;padding:6px 8px;break-inside:avoid;font-size:9.5pt}
.sheet .sgb .im{height:52px;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid #000;margin-bottom:4px}
.sheet .sgb .im img{max-height:50px;max-width:100%}
.sheet .sgb b.h{display:block;color:var(--g);margin-bottom:4px}
.sheet .pg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .pg figure{margin:0;border:1px solid #999;break-inside:avoid}
.sheet .pg img{width:100%;height:60mm;object-fit:cover;display:block}
.sheet .pg figcaption{padding:3px 5px;font-size:9pt}
.sheet .brk{break-before:page}
.sheet .hdr{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--g);padding-bottom:6px;margin-bottom:8px}
.sheet .hdr img{max-height:14mm;max-width:45mm}.sheet .hdr b{color:var(--g);font-size:13pt;letter-spacing:.06em}.sheet .hdr span{font-weight:700;color:#444}
@media print{
  @page{size:Letter;margin:12mm}
  body{background:#fff}
  .no-print{display:none!important}
  main{padding:0;max-width:none}
  .sheet{border:0;padding:0;max-width:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top no-print" id="top"></header>
<main id="main"></main>
<datalist id="dl-inm"><option value="RCC"><option value="ECC"><option value="Plaza Roble"><option value="Multiplaza Escazú"><option value="Multiplaza Curridabat"></datalist>
<script>
/* ================= Utilidades ================= */
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='on')for(const ev in v)e.addEventListener(ev,v[ev]);else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v===true?'':v)}for(const x of c.flat(9))if(x!=null&&x!==false)e.append(x.nodeType?x:document.createTextNode(x));return e};
const getp=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
const setp=(o,p,v)=>{const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){a=a[ks[i]]??={}}a[ks[ks.length-1]]=v};
const E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>{const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())};
const addDays=(s,n)=>{if(!s||n===''||isNaN(n))return'';const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+Number(n));return iso(d)};
const addMonths=(s,n)=>{if(!s||n===''||isNaN(n))return'';const d=new Date(s+'T00:00:00');const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+Number(n));const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return iso(d)};
const D=s=>s?s.split('-').reverse().join('/'):'';
const DT=(f,t)=>[D(f),t].filter(Boolean).join(' – ');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fdt=ts=>{const d=new Date(ts),z=n=>String(n).padStart(2,'0');return D(iso(d))+' '+z(d.getHours())+':'+z(d.getMinutes())};
/* ---- Memoria local: contratistas, nombres, perfiles por proyecto ---- */
let MEMO=null;
const mem=()=>{if(MEMO)return MEMO;try{MEMO=JSON.parse(localStorage.getItem('actas_mem_v1')||'{}')}catch(e){MEMO={}}return MEMO};
const memSave=()=>{try{localStorage.setItem('actas_mem_v1',JSON.stringify(MEMO||{}))}catch(e){}};
const getLogo=()=>{try{return localStorage.getItem('actas_logo')||''}catch(e){return''}};
const PROF=['proyecto','inmueble','propietario','contratista','cliente','inspeccion','lugar','cat','dest','wa'];
const lsJSON=(k,def)=>{try{return JSON.parse(localStorage.getItem(k)||'')||def}catch(e){return def}};
function learn(d){
  const M=mem();
  const add=(k,v)=>{v=(v||'').trim();if(!v||v.toUpperCase()==='N.A.')return;const a=M[k]||(M[k]=[]);if(!a.includes(v))a.push(v)};
  add('contratistas',d.contratista);add('inspectores',d.inspeccion);add('clientes',d.cliente);
  const per=(n,t,c)=>{n=(n||'').trim();if(!n)return;const o=M.nombres||(M.nombres={});const p=o[n]||(o[n]={});if(t)p.t=t;if(c)p.c=c};
  Object.values(d.firma||{}).forEach(f=>per(f&&f.nombre));Object.values(d.rep||{}).forEach(r=>per(r&&r.n,r&&r.t,r&&r.c));
  if(d.codigo){const P=M.proys||(M.proys={});const o=P[d.codigo]||(P[d.codigo]={});for(const k of PROF)if(d[k])o[k]=d[k]}
  memSave();
  try{ // catálogo compartido con la app de Informes (mismo origen)
    if(d.proyecto){const l=lsJSON('roble_proys_v1',[]);if(!l.includes(d.proyecto)){l.push(d.proyecto);localStorage.setItem('roble_proys_v1',JSON.stringify(l))}
      if(d.dest){const m=lsJSON('roble_dest_v1',{});m[d.proyecto]=d.dest;localStorage.setItem('roble_dest_v1',JSON.stringify(m))}}
  }catch(e){}
}
function fillDL(){
  const M=mem(),ext=lsJSON('roble_proys_v1',[]);
  const mk=(id,arr)=>{let d=document.getElementById(id);if(!d){d=h('datalist',{id});document.body.append(d)}d.innerHTML='';[...new Set(arr)].filter(Boolean).forEach(v=>d.append(h('option',{value:v})))};
  const P=Object.entries(M.proys||{});
  mk('dl-cod',P.map(([k])=>k));mk('dl-proy',[...P.map(([,v])=>v.proyecto),...ext]);mk('dl-contr',M.contratistas||[]);mk('dl-insp',M.inspectores||[]);mk('dl-cli',M.clientes||[]);mk('dl-nom',Object.keys(M.nombres||{}));
}

/* ================= Almacenamiento (IndexedDB) ================= */
const DB={db:null,mem:{},
 async open(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('actas-gr',1);r.onupgradeneeded=()=>r.result.createObjectStore('actas',{keyPath:'id'});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch(e){this.db=null}},
 async all(){if(!this.db)return Object.values(this.mem);return new Promise(res=>{const q=this.db.transaction('actas').objectStore('actas').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>res([])})},
 async put(a){if(!this.db){this.mem[a.id]=a;return}return new Promise(res=>{const t=this.db.transaction('actas','readwrite');t.objectStore('actas').put(a);t.oncomplete=res;t.onerror=res})},
 async del(id){if(!this.db){delete this.mem[id];return}return new Promise(res=>{const t=this.db.transaction('actas','readwrite');t.objectStore('actas').delete(id);t.oncomplete=res;t.onerror=res})}};

/* ================= Catálogos (formatos Grupo Roble) ================= */
const REQ=['Contrato firmado por ambas partes','Póliza de riesgos del trabajo (INS) vigente','Póliza todo riesgo construcción vigente','Póliza de responsabilidad civil vigente','Garantía de cumplimiento entregada','Garantía de anticipo entregada (si hay anticipo)','Permiso de construcción / visado CFIA','Planos y especificaciones para construcción (indicar revisión)','Cronograma del contratista entregado e integrado al maestro','Planilla CCSS y lista de personal autorizado','Encargado de salud ocupacional designado'];
const SITIO=['Áreas entregadas y cerramientos','Accesos y rutas de ingreso / evacuación','Horarios autorizados (diurno / nocturno)','Áreas de acopio, bodega y parqueo de contratista','Servicios provisionales (electricidad, agua) y puntos de conexión','Condiciones existentes (registro fotográfico en Anexo 1)','Reglas del inmueble: seguridad, limpieza, polvo y ruido'];
const ROLES=['Gerente de Proyecto (GR)','Inspección / Supervisión','Operaciones del inmueble','Director técnico (contratista)','Ingeniero residente / maestro de obras','Salud ocupacional (contratista)'];
const ANX_I=['Anexo 1: Registro fotográfico de condiciones existentes','Anexo 2: Cronograma del contratista','Anexo 3: Copia de pólizas y garantías','Anexo 4: Plano de áreas entregadas, accesos y acopio'];
const VERIF=['Obra terminada según alcance contratado y órdenes de cambio aprobadas','Recorrido realizado con Operaciones, Inspección y Contratista','Pruebas funcionales y certificados entregados (eléctrico, HVAC, contra incendio, elevadores, otros)','Sistemas de protección contra incendio y rutas de evacuación operativos','No conformidades de calidad cerradas','Planos as-built (indicar revisión)','Manuales de operación y mantenimiento','Garantías de equipos y de calidad / vicios ocultos','Capacitación al personal de mantenimiento','Llaves, tarjetas, claves y accesos entregados','Limpieza final, retiro de materiales, cerramientos y desechos'];
const ANX_R=['Anexo 1: Punch list detallado con registro fotográfico','Anexo 2: Planos as-built','Anexo 3: Certificados y pruebas de sistemas','Anexo 4: Manuales y garantías de equipos','Anexo 5: Registro de capacitación al personal de mantenimiento'];
const SIG_I={gr:[['gr1','Gerente de Proyecto'],['gr2','Inspección / Supervisión'],['gr3','Operaciones del inmueble']],co:[['co1','Representante legal'],['co2','Director técnico'],['co3','Ingeniero residente']]};
const SIG_R={gr:SIG_I.gr,co:SIG_I.co,cl:[['cl1','Representante autorizado'],['cl2','']]};
const TYPES={inicio:{name:'Acta de Inicio de Obra',short:'Inicio'},recepcion:{name:'Acta de Recepción de Obra',short:'Recepción'}};

/* ================= Estado ================= */
let actas=[],cur=null,view='home',saveT=null;
const now=()=>{const d=new Date();return{f:iso(d),t:String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}};
function newActa(type,from){
  const n=now();
  const d={codigo:'',cat:'',proyecto:'',inmueble:'',propietario:'',contratista:'',fechaInicio:'',terminacion:'',lugar:'',fechaActa:n.f,horaActa:n.t,obs:'',anex:{},fotos:[],firma:{},dest:'',wa:''};
  if(type==='inicio'){d.plazo='';d.req={};d.sitio={};d.rep={};d.dia='';d.hora='';}
  else{d.cliente='';d.inspeccion='';d.tipo='';d.res='';d.dCorr='';d.fCorr='';d.motivos='';d.fNueva='';d.ver={};d.punch=[{},{},{}];d.solic=[{}];d.gInicio='';d.gMeses='';d.gFin='';}
  if(from){for(const k of['codigo','cat','proyecto','inmueble','propietario','contratista','fechaInicio','terminacion','lugar','cliente','dest','wa'])d[k]=from.d[k]??d[k];
    if(type==='recepcion'&&from.type==='inicio'){d.inspeccion=getp(from.d,'rep.1.n')||'';for(const k of['gr1','gr2','gr3','co1','co2','co3']){const f=from.d.firma[k];if(f&&f.nombre)d.firma[k]={nombre:f.nombre}}}}
  return{id:uid(),type,created:Date.now(),updated:Date.now(),hist:[],d};
}
function save(){clearTimeout(saveT);const s=document.getElementById('st');if(s)s.textContent='Guardando…';cur&&(cur.touched=true);saveT=setTimeout(async()=>{if(!cur)return;cur.updated=Date.now();await DB.put(cur);const s=document.getElementById('st');if(s)s.textContent='Guardado ✓'},350)}
function setD(path,val){setp(cur.d,path,val);const el=document.querySelector('[data-path="'+path+'"]');if(el)el.value=val}
function onChange(path){
  const d=cur.d;
  if(cur.type==='inicio'&&(path==='fechaInicio'||path==='plazo'))setD('terminacion',addDays(d.fechaInicio,d.plazo));
  if(cur.type==='recepcion'){
    if(['fechaActa','dCorr','res'].includes(path)&&d.res==='esencial')setD('fCorr',addDays(d.fechaActa,d.dCorr));
    if(['fechaActa','tipo'].includes(path)&&d.tipo==='Provisional'&&d.fechaActa)setD('gInicio',d.fechaActa);
    if(['fechaActa','tipo','gInicio','gMeses'].includes(path))setD('gFin',addMonths(d.gInicio,d.gMeses));
  }
  save();
}

/* ================= Componentes de formulario ================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function mic(el,path){
  if(!SR)return null;
  const b=h('button',{type:'button',class:'mic',title:'Dictar'},'🎤');let rec=null;
  b.onclick=()=>{
    if(rec){rec.stop();return}
    rec=new SR();rec.lang='es-CR';rec.interimResults=false;rec.continuous=true;
    rec.onresult=e=>{let t='';for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)t+=e.results[i][0].transcript;if(t){el.value=(el.value?el.value+' ':'')+t.trim();setp(cur.d,path,el.value);onChange(path)}};
    rec.onend=()=>{rec=null;b.classList.remove('on')};rec.onerror=()=>{};
    b.classList.add('on');try{rec.start()}catch(e){rec=null;b.classList.remove('on')}
  };
  return b;
}
function autofill(path){

    function table(el){
      doc.autoTable({html:el,startY:y,theme:'grid',margin:{left:M,right:M,top:M,bottom:16},
        styles:{font:'helvetica',fontSize:8.5,cellPadding:1.6,lineColor:[150,150,150],lineWidth:.2,textColor:0,valign:'top',overflow:'linebreak'},
        didParseCell:d=>{const r=d.cell.raw;if(!r||!r.tagName)return;d.cell.text=d.cell.text.map(T);
          if(r.tagName==='TH'){d.cell.styles.fontStyle='bold';d.cell.styles.fillColor=[232,241,236]}
          if(r.classList.contains('l')){d.cell.styles.fontStyle='bold';d.cell.styles.fillColor=[241,244,242]}
          if(r.style&&r.style.height)d.cell.styles.minCellHeight=parseFloat(r.style.height)*0.2646}});
      y=doc.lastAutoTable.finalY+3;
    }
    async function sigs(el){
      const kids=[...el.children],heads=kids.filter(k=>k.tagName==='B'),boxes=kids.filter(k=>k.tagName!=='B'),cols=heads.length||1,cw=CW/cols,hb=31;
      ens(42);heads.forEach((k,i)=>{doc.setFont('helvetica','bold');doc.setFontSize(9.5);doc.setTextColor(...GREEN);doc.text(T(k.textContent),M+i*cw,y+3)});y+=6;
      for(let r=0;r*cols<boxes.length;r++){
        ens(hb+4);
        for(let c=0;c<cols;c++){
          const b=boxes[r*cols+c];if(!b||!b.classList.contains('sgb'))continue;
          const x=M+c*cw,w=cw-3;doc.setDrawColor(150);doc.setLineWidth(.2);doc.rect(x,y,w,hb);
          const im=b.querySelector('img');
          if(im){const I=await img(im.src);if(I){const mh=14,mw=w-6;let iw=mw,ih=iw*I.height/I.width;if(ih>mh){ih=mh;iw=ih*I.width/I.height}try{doc.addImage(im.src,fmt(im.src),x+(w-iw)/2,y+15-ih,iw,ih)}catch(e){}}}
          doc.setDrawColor(0);doc.setLineWidth(.3);doc.line(x+3,y+16,x+w-3,y+16);
          const c2=b.cloneNode(true);const q=c2.querySelector('.im');if(q)q.remove();
          doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(0);
          let ty=y+21;plain(c2).split('\n').filter(Boolean).forEach(l=>{doc.text(doc.splitTextToSize(l,w-6)[0]||'',x+3,ty);ty+=4})
        }
        y+=hb+3;
      }
    }
    async function photosPdf(el){
      const figs=[...el.querySelectorAll('figure')],w=(CW-4)/2;doc.setFontSize(8.5);
      for(let i=0;i<figs.length;i+=2){
        const items=[];
        for(const f of figs.slice(i,i+2)){const im=f.querySelector('img'),I=await img(im.src);let iw=w,ih=I?w*I.height/I.width:0;if(ih>70){ih=70;iw=ih*I.width/I.height}items.push({src:im.src,iw,ih,cap:doc.splitTextToSize(plain(f.querySelector('figcaption')),w-2).slice(0,3)})}
        const rowH=Math.max(...items.map(it=>it.ih))+16;ens(rowH);
        items.forEach((it,k)=>{const x=M+k*(w+4);if(it.ih)try{doc.addImage(it.src,fmt(it.src),x,y,it.iw,it.ih)}catch(e){}
          doc.setFont('helvetica','normal');doc.setFontSize(8.5);doc.setTextColor(0);it.cap.forEach((l,n)=>doc.text(l,x,y+it.ih+4+n*3.8))});
        y+=rowH;
      }
    }
    for(const el of host.children){
      const c=el.className||'';
      if(c.includes('hdr')){
        const lg=el.querySelector('img');
        if(lg){const I=await img(lg.src);if(I){const ih=12,iw=Math.min(ih*I.width/I.height,50);try{doc.addImage(lg.src,fmt(lg.src),M,y,iw,ih)}catch(e){}}}
        else{doc.setFont('helvetica','bold');doc.setFontSize(13);doc.setTextColor(...GREEN);doc.text('GRUPO ROBLE',M,y+8)}
        const sp=el.querySelector('span');if(sp&&sp.textContent){doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(60);doc.text(T(sp.textContent),W-M,y+8,{align:'right'})}
        doc.setDrawColor(...GREEN);doc.setLineWidth(.6);doc.line(M,y+14,W-M,y+14);y+=19;
      }else if(el.tagName==='H1'){doc.setFont('helvetica','bold');doc.setFontSize(15);doc.setTextColor(...GREEN);doc.text(T(el.textContent),W/2,y+5,{align:'center'});y+=9}
      else if(c.includes('sub')){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.setTextColor(90);doc.text(T(el.textContent),W/2,y+3,{align:'center'});y+=8}
      else if(el.tagName==='H2')h2(el);
      else if(el.tagName==='TABLE')table(el);
      else if(el.tagName==='P'){const it=c.includes('it');para(el,{it,fs:it?8.5:9.5,c:it?[68,68,68]:undefined})}
      else if(c.split(' ').includes('sg'))await sigs(el);
      else if(c.includes('brk')){doc.addPage();y=M}
      else if(c.split(' ').includes('pg'))await photosPdf(el);
    }
    const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){doc.setPage(i);doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(120);doc.text(T(docName()),M,H-8);doc.text('Página '+i+' de '+n,W-M,H-8,{align:'right'})}
    return doc.output('blob');
  }finally{host.remove()}
}
async function enviar(canal){
  toast('Generando PDF…',8000);
  let blob;try{blob=await makePdf()}catch(e){console.error(e);toast('No se pudo generar el PDF. Use "Imprimir".',5000);return}
  const d=cur.d,name=docName(),file=new File([blob],name+'.pdf',{type:'application/pdf'});
  if(canal==='download'){downloadBlob(blob,name+'.pdf');return}
  const text=[name,d.contratista?'Contratista: '+d.contratista:'',d.fechaActa?'Fecha: '+D(d.fechaActa):'',canal==='mail'&&d.dest?'Para: '+d.dest:'','Se adjunta el acta en PDF.'].filter(Boolean).join('\n');
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name,text});return}}catch(e){if(e&&e.name==='AbortError')return}
  downloadBlob(blob,name+'.pdf');
  if(canal==='save'){toast('PDF descargado. Guárdelo en su carpeta o en Drive.',5000);return}
  const to=(d.dest||'').split(/[,;\s]+/).filter(Boolean).join(','),wa=(d.wa||'').replace(/\D/g,'');
  const link=canal==='mail'?'mailto:'+to+'?subject='+encodeURIComponent(name)+'&body='+encodeURIComponent(text+'\n\n(Adjunte el PDF descargado)'):'https://wa.me/'+wa+'?text='+encodeURIComponent(text+'\n(Adjunte el PDF descargado)');
  toast('PDF descargado. Adjúntelo en '+(canal==='mail'?'el correo':'WhatsApp')+'.',5000);
  setTimeout(()=>{const l=h('a',{href:link,target:'_blank',rel:'noopener'});document.body.append(l);l.click();l.remove()},600);
}

/* ---- Seguimiento del punch list ---- */
function renderPunch(a){
  cur=a;view='punch';
  topbar('Punch list',h('button',{class:'btn ghost',on:{click:()=>renderHome()}},'‹ Actas'));
  const m=document.getElementById('main');m.innerHTML='';
  const st=punchStat(a),items=punchItems(a);
  m.append(h('div',{class:'card'},h('div',{class:'t',style:'font-weight:700'},label(a)),h('div',{class:'s'+(st.v?' venc':'')},st.c+' de '+st.t+' cerrados'+(st.v?' · '+st.v+' vencido(s)':'')),h('div',{class:'pbar'},h('i',{style:'width:'+(st.t?Math.round(100*st.c/st.t):0)+'%'}))));
  items.forEach(({p,i})=>{
    const venc=!p.cierre&&p.fecha&&p.fecha<today();
    const chk=h('input',{type:'checkbox'});chk.checked=!!p.cierre;
    chk.addEventListener('change',async()=>{p.cierre=chk.checked?today():'';(a.hist??=[]).push({t:Date.now(),a:'Punch '+(i+1)+(chk.checked?' cerrado':' reabierto')});a.updated=Date.now();await DB.put(a);renderPunch(a)});
    const vb=h('input',{placeholder:'V.° B. (quién da el visto bueno)',value:p.vb||''});
    vb.addEventListener('change',async()=>{p.vb=vb.value;a.updated=Date.now();await DB.put(a)});
    m.append(h('div',{class:'card'},
      h('div',{class:'t'},(i+1)+'. '+(p.desc||'(sin descripción)')),
      h('div',{class:'s'},[p.ubic,p.resp].filter(Boolean).join(' · ')),
      h('div',{class:'s'+(venc?' venc':'')},p.fecha?'Compromiso: '+D(p.fecha)+(venc?' · VENCIDO':''):'Sin fecha compromiso'),
      h('label',{class:'chk'},chk,h('span',{},p.cierre?'Cerrado el '+D(p.cierre):'Marcar como cerrado')),vb));
  });
}

(async()=>{await DB.open();applyDark();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}renderHome();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{})})();
